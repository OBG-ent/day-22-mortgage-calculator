<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortgage Calculator — Know Your Monthly Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>🏠 Mortgage Calculator</h1>
    <p class="subtitle">See what your monthly payment really looks like — before you sign anything.</p>

    <form id="calc-form">
      <label>
        Home price ($)
        <input type="number" id="price" value="500000" min="1" step="1000" />
      </label>

      <label>
        Down payment ($)
        <input type="number" id="down" value="100000" min="0" step="1000" />
      </label>

      <label>
        Interest rate (% per year)
        <input type="number" id="rate" value="5.5" min="0" step="0.01" />
      </label>

      <label>
        Amortization (years)
        <input type="number" id="years" value="25" min="1" max="40" step="1" />
      </label>

      <button type="submit">Calculate payment</button>
    </form>

    <!-- Results stay hidden until the first calculation runs -->
    <section id="results" class="hidden">
      <h2>Your payment plan</h2>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Monthly payment</span>
          <span class="stat-value" id="monthly">$0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Amount borrowed</span>
          <span class="stat-value" id="borrowed">$0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Total interest paid</span>
          <span class="stat-value" id="interest">$0</span>
        </div>
      </div>

      <h3>Year-by-year balance</h3>
      <table id="schedule">
        <thead>
          <tr><th>Year</th><th>Paid toward principal</th><th>Paid in interest</th><th>Balance left</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
